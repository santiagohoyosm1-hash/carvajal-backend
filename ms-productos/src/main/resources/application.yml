server:
  port: ${PORT:8081}          # Railway inyecta PORT; en local usa 8081
  error:
    include-message: always

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:4200}   # varios: separados por coma

spring:
  application:
    name: ms-productos
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wishlist_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:carvajal}
    password: ${DB_PASSWORD:carvajal123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}

seed:
  productos: ${SEED_PRODUCTOS:true}

security:
  jwt:
    secret: ${JWT_SECRET}
