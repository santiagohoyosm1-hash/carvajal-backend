server:
  port: ${PORT:8084}          # Railway inyecta PORT; en local usa 8084
  error:
    include-message: always

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:4200}   # varios: separados por coma

spring:
  application:
    name: ms-notificaciones
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:carvajal}
    password: ${RABBITMQ_PASSWORD:carvajal123}
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:true}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wishlist_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:carvajal}
    password: ${DB_PASSWORD:carvajal123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}

app:
  messaging:
    exchange: carvajal.events
    queue: notificaciones.movimiento.registrado
    routing-key: historial.movimiento.registrado

security:
  jwt:
    secret: ${JWT_SECRET}
