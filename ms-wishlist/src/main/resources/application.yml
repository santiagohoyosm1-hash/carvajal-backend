server:
  port: ${PORT:8082}          # Railway inyecta PORT; en local usa 8082
  error:
    include-message: always

productos:
  url: ${PRODUCTOS_URL:http://localhost:8081}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:4200}   # varios: separados por coma

spring:
  application:
    name: ms-wishlist
  datasource:
    # Local: MySQL en localhost:3306. Railway: define DB_URL con las variables del servicio MySQL (ver README).
    url: ${DB_URL:jdbc:mysql://localhost:3306/wishlist_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:carvajal}
    password: ${DB_PASSWORD:carvajal123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}   # en producción: validate (con el script SQL) o migraciones Flyway
    show-sql: ${SHOW_SQL:false}

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}

auth:
  admin:
    username: ${AUTH_ADMIN_USERNAME:}
    password: ${AUTH_ADMIN_PASSWORD:}
