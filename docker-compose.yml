# MySQL local para desarrollo. Conéctate desde MySQL Workbench a localhost:3306.
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: carvajal-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: carvajal
      RABBITMQ_DEFAULT_PASS: carvajal123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: carvajal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: wishlist_db
      MYSQL_USER: carvajal
      MYSQL_PASSWORD: carvajal123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01_wishlist_db.sql:/docker-entrypoint-initdb.d/01_wishlist_db.sql:ro

volumes:
  mysql_data:
  rabbitmq_data:
