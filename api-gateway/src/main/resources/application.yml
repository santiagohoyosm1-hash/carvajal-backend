server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

gateway:
  services:
    wishlist-url: ${WISHLIST_URL:http://localhost:8082}
    productos-url: ${PRODUCTOS_URL:http://localhost:8081}
    historial-url: ${HISTORIAL_URL:http://localhost:8083}
    notificaciones-url: ${NOTIFICACIONES_URL:http://localhost:8084}

security:
  jwt:
    secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
